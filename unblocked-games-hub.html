        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #00d4ff;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: #7b2cbf;
            box-shadow: 0 0 20px rgba(123, 44, 191, 0.3);
        }

        .stats {
            text-align: center;
            font-size: 0.95em;
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(123, 44, 191, 0.1) 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-card:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2) 0%, rgba(123, 44, 191, 0.2) 100%);
            border-color: rgba(0, 212, 255, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .game-name {
            font-size: 1em;
            font-weight: 600;
            word-break: break-word;
            position: relative;
            z-index: 1;
            color: #00d4ff;
        }

        .hidden {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #a0a0a0;
            font-size: 1.1em;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .game-card {
                padding: 15px;
            }

            .search-container {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }
        }
    </style>
</head>

        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const displayCount = document.getElementById('displayCount');
        const gameCount = document.getElementById('gameCount');
        const noResults = document.getElementById('noResults');

        function formatGameName(name) {
            return name
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function renderGames(gamesToRender) {
            gamesGrid.innerHTML = '';
            
            if (gamesToRender.length === 0) {
                gamesGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
                displayCount.textContent = '0';
                return;
            }

            gamesGrid.classList.remove('hidden');
            noResults.classList.add('hidden');
            displayCount.textContent = gamesToRender.length;

            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<span class="game-name">${formatGameName(game)}</span>`;
                
                card.addEventListener('click', () => {
                    // Copy game name to clipboard
                    navigator.clipboard.writeText(game).then(() => {
                        const originalText = card.querySelector('.game-name').textContent;
                        card.querySelector('.game-name').textContent = 'Copied!';
                        setTimeout(() => {
                            card.querySelector('.game-name').textContent = originalText;
                        }, 1500);
                    });
                });

                gamesGrid.appendChild(card);
            });
        }

        function filterGames(searchTerm) {
            const term = searchTerm.toLowerCase();
            return games.filter(game => 
                game.toLowerCase().includes(term) ||
                formatGameName(game).toLowerCase().includes(term)
            );
        }

        searchInput.addEventListener('input', (e) => {
            const filtered = filterGames(e.target.value);
            renderGames(filtered);
        });

        gameCount.textContent = games.length;
        renderGames(games);

        // Download functionality
        document.addEventListener('keydown', (e) => {

                alert('This page is ready to be saved! Use Ctrl+S (or Cmd+S on Mac) to save it as an HTML file to your computer.');

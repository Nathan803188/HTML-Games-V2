<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games - Play 420+ Games Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 800;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
            margin-bottom: 5px;
        }

        .game-count {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .search-box {
            max-width: 500px;
            margin: 30px auto;
            position: relative;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0 30px 0;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-size: 0.9rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .btn.active {
            background: white;
            color: #667eea;
        }

        .stats {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .game-card h3 {
            font-size: 1.1rem;
            word-break: break-word;
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .no-games {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
        }

        .hidden {
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .game-card {
                min-height: 120px;
            }

            .game-icon {
                font-size: 2rem;
            }

            .game-card h3 {
                font-size: 0.95rem;
            }
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>

        function getGameIcon(name) {
            const iconMap = {
                'minecraft': '⛏️', 'mario': '👨‍🦲', 'pacman': '👾', 'snake': '🐍', 'chess': '♟️', 'chess': '♟️',

                'racing': '🏎️', 'car': '🚗', 'bike': '🏍️', 'rocket': '🚀', 'space': '🌌',
                'zombie': '🧟', 'gun': '🔫', 'sword': '⚔️', 'war': '⚔️', 'battle': '⚔️',
                'cooking': '👨‍🍳', 'pizza': '🍕', 'burger': '🍔', 'food': '🍖',
                'duck': '🦆', 'fish': '🐠', 'frog': '🐸', 'cat': '🐱', 'dog': '🐕',
                'cookie': '🍪', 'clicker': '🖱️', 'miner': '⛏️', 'craft': '🔨',
                'draw': '✏️', 'paint': '🎨', 'art': '🎨', 'music': '🎵', 'piano': '🎹',
                'rope': '🪢', 'ball': '⚪', 'block': '🟫', 'puzzle': '🧩',
                'run': '🏃', 'jump': '🤸', 'fly': '✈️', 'escape': '🚪'
            };

            for (const [key, icon] of Object.entries(iconMap)) {
                if (name.toLowerCase().includes(key)) return icon;
            }
            return '🎮';
        }

        function formatGameName(name) {
            return name
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const resultCount = document.getElementById('resultCount');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = `${games.length} Total Games`;
            resultCount.textContent = `Showing ${filteredGames.length} game${filteredGames.length !== 1 ? 's' : ''}`;

            if (filteredGames.length === 0) {
                grid.innerHTML = '<div class="no-games">No games found. Try a different search!</div>';
                return;
            }

            grid.innerHTML = filteredGames.map(game => `
                <div class="game-card" onclick="openGame('${game}')">
                    <div class="game-icon">${getGameIcon(game)}</div>
                    <h3>${formatGameName(game)}</h3>
                </div>
            `).join('');
        }

        function openGame(gameName) {
            window.location.href = `${gameName}/`;
        }

        function searchGames(query) {
            const q = query.toLowerCase();
            filteredGames = games.filter(game =>
                game.toLowerCase().includes(q) ||
                formatGameName(game).toLowerCase().includes(q)
            );
            renderGames();
        }

        function sortGames(method) {
            currentSort = method;
            document.querySelectorAll('.controls .btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (method === 'name') {
                filteredGames.sort();
            } else if (method === 'random') {
                for (let i = filteredGames.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filteredGames[i], filteredGames[j]] = [filteredGames[j], filteredGames[i]];
                }
            }
            renderGames();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filteredGames = [...games];
            sortGames('name');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchGames(e.target.value);
        });

        // Initial render
        renderGames();
